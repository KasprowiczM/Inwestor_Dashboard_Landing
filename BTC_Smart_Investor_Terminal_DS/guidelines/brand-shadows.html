<!-- @dsCard group="Brand" viewport="700x180" name="Shadows & Glows" subtitle="Elevation on dark + ice/gold signal glows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 28px; font-family: var(--font-mono); display: flex; gap: 22px; align-items: center; }
  .c { display: flex; flex-direction: column; align-items: center; gap: 11px; }
  .b { width: 96px; height: 72px; border-radius: var(--radius-lg); background: var(--bg-card); border: 1px solid var(--line); }
  .l { font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="c"><div class="b" style="box-shadow: var(--shadow-card);"></div><div class="l">shadow-card</div></div>
  <div class="c"><div class="b" style="box-shadow: var(--shadow-raise);"></div><div class="l">shadow-raise</div></div>
  <div class="c"><div class="b" style="box-shadow: var(--glow-ice-strong); border-color: var(--line-ice);"></div><div class="l">glow-ice</div></div>
  <div class="c"><div class="b" style="box-shadow: var(--glow-gold); border-color: var(--line-gold);"></div><div class="l">glow-gold</div></div>
</body>
</html>
