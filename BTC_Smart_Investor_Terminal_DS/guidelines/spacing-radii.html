<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 24px; font-family: var(--font-mono); display: flex; gap: 16px; align-items: center; }
  .c { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .b { width: 78px; height: 78px; background: var(--grad-glass), var(--bg-card); border: 1px solid var(--line-strong); }
  .l { font-size: 10px; color: var(--text-secondary); }
  .pill { width: 110px; height: 44px; border-radius: var(--radius-pill); display:flex;align-items:center;justify-content:center;
          background: var(--grad-glass), var(--bg-card); border:1px solid var(--line-strong); color: var(--text-muted); font-size: 10px; }
</style>
</head>
<body>
  <div class="c"><div class="b" style="border-radius: var(--radius-sm);"></div><div class="l">sm · 5</div></div>
  <div class="c"><div class="b" style="border-radius: var(--radius-md);"></div><div class="l">md · 8</div></div>
  <div class="c"><div class="b" style="border-radius: var(--radius-lg);"></div><div class="l">lg · 12</div></div>
  <div class="c"><div class="b" style="border-radius: var(--radius-xl);"></div><div class="l">xl · 18</div></div>
  <div class="c"><div class="b" style="border-radius: var(--radius-2xl);"></div><div class="l">2xl · 26</div></div>
  <div class="c"><div class="pill">pill</div><div class="l">999</div></div>
</body>
</html>
