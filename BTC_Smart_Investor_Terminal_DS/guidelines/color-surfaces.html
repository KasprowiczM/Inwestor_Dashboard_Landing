<!-- @dsCard group="Colors" viewport="700x190" name="Canvas & Surfaces" subtitle="Abyssal near-black stack — page to elevated card" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 22px; font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; height: 116px; border-radius: var(--radius-md); border: 1px solid var(--line);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--text-primary); letter-spacing: .03em; }
  .hx { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--abyss);"><span class="nm">abyss</span><span class="hx">#04060A</span></div>
    <div class="sw" style="background: var(--bg-base);"><span class="nm">bg-base</span><span class="hx">#090C12</span></div>
    <div class="sw" style="background: var(--bg-surface);"><span class="nm">bg-surface</span><span class="hx">#0D121A</span></div>
    <div class="sw" style="background: var(--bg-card);"><span class="nm">bg-card</span><span class="hx">#101722</span></div>
    <div class="sw" style="background: var(--bg-elevated);"><span class="nm">bg-elevated</span><span class="hx">#151E2C</span></div>
  </div>
</body>
</html>
