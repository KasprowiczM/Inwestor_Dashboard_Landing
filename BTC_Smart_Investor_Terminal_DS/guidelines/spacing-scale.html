<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 24px; font-family: var(--font-mono); display: flex; align-items: flex-end; gap: 14px; }
  .c { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .b { background: var(--grad-ice-cta); border-radius: 3px; box-shadow: var(--glow-ice); }
  .l { font-size: 10px; color: var(--text-muted); }
  .v { font-size: 11px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="c"><div class="b" style="width:4px;height:4px;"></div><div class="l">1</div><div class="v">4</div></div>

  <div class="c"><div class="b" style="width:24px;height:24px;"></div><div class="l">6</div><div class="v">24</div></div>
  <div class="c"><div class="b" style="width:32px;height:32px;"></div><div class="l">8</div><div class="v">32</div></div>
  <div class="c"><div class="b" style="width:48px;height:48px;"></div><div class="l">12</div><div class="v">48</div></div>
  <div class="c"><div class="b" style="width:64px;height:64px;"></div><div class="l">16</div><div class="v">64</div></div>
  <div class="c"><div class="b" style="width:96px;height:96px;"></div><div class="l">24</div><div class="v">96</div></div>
</body>
</html>
