<!-- @dsCard group="Colors" viewport="700x170" name="Text & Hairlines" subtitle="Foreground ramp and border tokens on abyss" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 22px; font-family: var(--font-sans); display: flex; gap: 28px; align-items: center; }
  .stack > div { margin-bottom: 7px; font-size: 15px; }
  .mono { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .lines { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .ln { height: 1px; }
  .lncap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-bottom: 5px; }
</style>
</head>
<body>
  <div class="stack">
    <div style="color: var(--text-primary); font-weight: 700;">Primary &nbsp;<span class="mono">#F4F7FB</span></div>
    <div style="color: var(--text-secondary);">Secondary &nbsp;<span class="mono">#9AA8BA</span></div>
    <div style="color: var(--text-muted);">Muted &nbsp;<span class="mono">#647287</span></div>
    <div style="color: var(--text-faint);">Faint &nbsp;<span class="mono">#3D4859</span></div>
  </div>
  <div class="lines">
    <div><div class="lncap">line-faint · 0.06</div><div class="ln" style="background: var(--line-faint);"></div></div>
    <div><div class="lncap">line · 0.10</div><div class="ln" style="background: var(--line);"></div></div>
    <div><div class="lncap">line-strong · 0.18</div><div class="ln" style="background: var(--line-strong);"></div></div>
    <div><div class="lncap">line-ice</div><div class="ln" style="background: var(--line-ice);"></div></div>
  </div>
</body>
</html>
