<!-- @dsCard group="Brand" viewport="700x220" name="Depth / Sonar Motif" subtitle="Signature: sonar-grid wash + ice glow descending into the abyss" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; }
  .stage { position: relative; height: 220px; background: var(--grad-abyss); overflow: hidden;
           display: flex; align-items: center; justify-content: center; }
  .stage::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(120% 80% at 50% -10%, rgba(103,232,249,0.16), transparent 46%);
    background-size: 44px 44px, 44px 44px, 100% 100%;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.95), transparent 82%);
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.95), transparent 82%);
  }
  .rings { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; }
  .ring { position: absolute; bottom: -120px; border-radius: 50%; border: 1px solid var(--line-ice); opacity: .5; }
  .cap { position: relative; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
         color: var(--ice-400); text-shadow: 0 0 16px var(--ice-glow); }
</style>
</head>
<body>
  <div class="stage">
    <div class="rings">
      <div class="ring" style="width: 220px; height: 220px;"></div>
      <div class="ring" style="width: 360px; height: 360px; opacity:.3;"></div>
      <div class="ring" style="width: 500px; height: 500px; opacity:.18;"></div>
    </div>
    <div class="cap">// descending to the floor</div>
  </div>
</body>
</html>
