<!-- @dsCard group="Type" viewport="700x190" name="Mono — JetBrains Mono" subtitle="Data, tickers, eyebrows, labels · the terminal voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 24px; font-family: var(--font-mono); }
  .eyebrow { color: var(--ice-400); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .num { color: var(--text-primary); font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 10px; letter-spacing: -0.01em; }
  .num .u { color: var(--text-muted); font-size: 18px; }
  .row { display: flex; gap: 26px; margin-top: 12px; }
  .row span { color: var(--text-secondary); font-size: 12px; letter-spacing: .04em; }
  .row b { color: var(--ice-400); font-weight: 600; }
</style>
</head>
<body>
  <div class="eyebrow">// BOTTOM SCORE · LIVE</div>
  <div class="num">72<span class="u"> / 100</span></div>
  <div class="row">
    <span>BTC <b>$61,480</b></span><span>DRAWDOWN <b>-58.2%</b></span><span>CONF <b>0.86</b></span>
  </div>
</body>
</html>
