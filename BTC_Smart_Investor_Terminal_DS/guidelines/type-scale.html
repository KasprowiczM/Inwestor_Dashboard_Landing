<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="hero → eyebrow, with token names" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 22px 24px; font-family: var(--font-sans); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--line-faint); }
  .r:last-child { border: 0; }
  .t { color: var(--text-primary); font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; }
  .k { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-left: auto; }
</style>
</head>
<body>
  <div class="r"><span class="t" style="font-size: 44px;">Aa Hero</span><span class="k">--fs-hero · clamp→7.2rem</span></div>
  <div class="r"><span class="t" style="font-size: 32px;">Display</span><span class="k">--fs-4xl</span></div>
  <div class="r"><span class="t" style="font-size: 24px;">Section heading</span><span class="k">--fs-2xl · 1.75rem</span></div>
  <div class="r"><span class="t" style="font-size: 18px; font-weight: 600;">Subhead</span><span class="k">--fs-lg · 1.125rem</span></div>
  <div class="r"><span class="t" style="font-size: 16px; font-family: var(--font-sans); font-weight: 400; color: var(--text-secondary);">Body copy</span><span class="k">--fs-base · 1rem</span></div>
  <div class="r"><span class="t" style="font-size: 12px; font-family: var(--font-mono); color: var(--ice-400); letter-spacing: .1em;">EYEBROW / LABEL</span><span class="k">--fs-mono-eyebrow</span></div>
</body>
</html>
