<!-- @dsCard group="Brand" viewport="700x200" name="Logo Lockup" subtitle="Gold Bitcoin mark + NADIR wordmark · the retained mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 26px; font-family: var(--font-display); display: flex; align-items: center; gap: 40px; }
  .lock { display: flex; align-items: center; gap: 14px; }
  .lock img { width: 46px; height: 46px; filter: drop-shadow(0 0 10px var(--gold-glow)); }
  .wm { display: flex; flex-direction: column; line-height: 1; }
  .wm b { font-size: 26px; font-weight: 800; letter-spacing: 0.14em; color: var(--text-primary); }
  .wm span { font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; }
  .alt { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg-card); }
  .alt img { width: 30px; height: 30px; }
  .alt b { font-size: 18px; font-weight: 800; letter-spacing: 0.12em; color: var(--text-primary); }
</style>
</head>
<body>
  <div class="lock">
    <img src="../assets/logo.svg" alt="NADIR" />
    <div class="wm"><b>NADIR</b><span>Bitcoin cycle intelligence</span></div>
  </div>
  <div class="alt"><img src="../assets/logo.svg" alt="" /><b>NADIR</b></div>
</body>
</html>
