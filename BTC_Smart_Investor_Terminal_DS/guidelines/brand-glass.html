<!-- @dsCard group="Brand" viewport="700x210" name="Glass Card & Eyebrow" subtitle="Core surface: glass card, mono eyebrow with signal dot" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--abyss); padding: 24px; font-family: var(--font-sans); }
  .card { max-width: 380px; padding: 20px; border-radius: var(--radius-lg);
          background: var(--grad-glass), var(--bg-glass); border: 1px solid var(--line);
          box-shadow: var(--shadow-card), var(--shadow-layer); }
  h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); margin: 12px 0 6px; }
  p { color: var(--text-secondary); font-size: 13.5px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <span class="nadir-eyebrow">// Okno akumulacji</span>
    <h3>Strefa otwarta</h3>
    <p>Bottom Score w paśmie DCA od 14 dni. Kontynuuj zakupy zgodnie z planem transz.</p>
  </div>
</body>
</html>
