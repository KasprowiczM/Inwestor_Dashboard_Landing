<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Invite Gate" description="Invite-only access wall shown to unauthorized visitors — code entry + request invite" -->
<helmet>
  <script src="./ds-base.js"></script>
</helmet>
<div style="position:relative; min-height:100vh; display:grid; place-items:center; padding:48px 24px; overflow:hidden; background:var(--grad-abyss); background-image:linear-gradient(rgba(255,255,255,0.026) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.026) 1px, transparent 1px), radial-gradient(120% 60% at 50% -6%, rgba(103,232,249,0.10), transparent 42%); background-size:56px 56px, 56px 56px, 100% 100%;">
  <div aria-hidden="true" style="position:absolute; top:-220px; left:50%; transform:translateX(-50%); width:620px; height:620px; border-radius:50%; border:1px solid var(--line-ice); opacity:0.18;"></div>
  <div aria-hidden="true" style="position:absolute; top:-120px; left:50%; transform:translateX(-50%); width:400px; height:400px; border-radius:50%; border:1px solid var(--line-ice); opacity:0.14;"></div>

  <div style="position:relative; z-index:1; width:min(540px, 100%); display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px;">
    <div style="position:relative; width:104px; height:104px; border-radius:50%; overflow:hidden; border:1px solid var(--line-ice); box-shadow:var(--shadow-raise), var(--glow-ice);">
      <img src="../../assets/orb.png" alt="" style="width:100%; height:100%; object-fit:cover; filter:saturate(0.95) contrast(1.06);" />
    </div>

    <x-import component-from-global-scope="NADIRDesignSystem_54e725.BrandLockup" layout="stack" size="md" hint-size="210px,46px"></x-import>

    <div style="display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:0.72rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--ice-400);">
      <span style="width:6px; height:6px; border-radius:50%; background:var(--ice-400); box-shadow:0 0 10px var(--ice-glow);"></span>{{ eyebrow }}
    </div>

    <h1 style="font-family:var(--font-display); font-size:clamp(2.1rem, 4.6vw, 3rem); font-weight:800; letter-spacing:-0.04em; line-height:1.02; color:var(--text-primary); margin:0;">
      {{ headline1 }} <span style="color:var(--ice-400); text-shadow:0 0 38px var(--ice-glow);">{{ headlineAccent }}</span>
    </h1>
    <p style="max-width:440px; font-size:clamp(0.98rem,1.3vw,1.1rem); line-height:1.62; color:var(--text-secondary); margin:0;">{{ sub }}</p>

    <div style="width:100%; padding:24px; border-radius:var(--radius-xl); background:var(--grad-glass), var(--bg-glass-strong); border:1px solid var(--line-strong); box-shadow:var(--shadow-card); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); text-align:left; display:flex; flex-direction:column; gap:16px;">
      <x-import component-from-global-scope="NADIRDesignSystem_54e725.Input" label="{{ codeLabel }}" placeholder="BTC-XXXX" hint-size="100%,72px"></x-import>
      <x-import component-from-global-scope="NADIRDesignSystem_54e725.Button" variant="primary" size="lg" full-width="{{ true }}" hint-size="100%,56px">{{ enter }}</x-import>
      <div style="height:1px; background:var(--line);"></div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <span style="font-size:13px; color:var(--text-muted);">{{ noCode }}</span>
        <x-import component-from-global-scope="NADIRDesignSystem_54e725.Button" variant="gold" size="md" hint-size="170px,46px">{{ request }}</x-import>
      </div>
    </div>

    <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
      <div style="display:inline-flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text-muted);">
        <x-import component-from-global-scope="NADIRDesignSystem_54e725.StatusChip" tone="ice" size="sm" hint-size="64px,22px">{{ smart }}</x-import>{{ smartNote }}
      </div>
      <div style="display:inline-flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text-muted);">
        <x-import component-from-global-scope="NADIRDesignSystem_54e725.StatusChip" tone="gold" size="sm" hint-size="78px,22px">{{ investor }}</x-import>{{ investorNote }}
      </div>
    </div>

    <p style="font-family:var(--font-mono); font-size:11px; color:var(--text-faint); line-height:1.5; max-width:420px; margin:0;">{{ disclaimer }}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pl&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pl&quot;,&quot;tsType&quot;:&quot;'pl'|'en'&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  L(pl, en) { return (this.props.lang === 'en') ? en : pl; }
  renderVals() {
    const L = (pl, en) => this.L(pl, en);
    return {
      eyebrow: L('Dostęp na zaproszenie · portal zamknięty', 'Invite-only · closed terminal'),
      headline1: L('Ten terminal jest', 'This terminal is'),
      headlineAccent: L('na zaproszenie.', 'invite-only.'),
      sub: L('BTC Smart Investor Terminal to zamknięty portal. Nie ma darmowej rejestracji — dołączasz wyłącznie na zaproszenie aktywnego członka lub administratora.',
             'BTC Smart Investor Terminal is a closed portal. There is no free signup — you join only on an invite from an active member or admin.'),
      codeLabel: L('Kod zaproszenia', 'Invite code'),
      enter: L('Wejdź do terminala', 'Enter terminal'),
      noCode: L('Nie masz kodu?', 'No invite code?'),
      request: L('Poproś o zaproszenie', 'Request invite'),
      smart: 'Smart',
      smartNote: L('śledzenie dna BTC', 'BTC bottom tracking'),
      investor: 'Investor',
      investorNote: L('pełny terminal', 'full terminal'),
      disclaimer: L('Narzędzie edukacyjne i informacyjne. Nie stanowi porady inwestycyjnej.',
                    'An educational and informational tool. Not investment advice.'),
    };
  }
}
</script>
</body>
</html>
